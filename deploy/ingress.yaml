apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spanktube
  namespace: spanktube
spec:
  ingressClassName: nginx
  rules:
    - host: spanktube.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
    - host: api.spanktube.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
    - host: media.spanktube.example.com
      http:
        paths:
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
