apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: spanktube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: gateway
          image: registry.local/spanktube/gateway:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: spanktube-jwt-public
          env:
            - name: USER_SERVICE_URL
              value: http://user-service:8083
            - name: UPSTREAM_SERVICE_URL
              value: http://youtube-upstream-service:8081
            - name: MEDIA_SERVICE_URL
              value: http://media-service:8082
            - name: CATALOG_SERVICE_URL
              value: http://catalog-service:8084
            - name: ARCHIVE_SERVICE_URL
              value: http://archive-service:8085
            - name: CORS_ALLOWED_ORIGINS
              value: https://spanktube.example.com
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: spanktube
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
