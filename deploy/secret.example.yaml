apiVersion: v1
kind: Secret
metadata:
  name: spanktube-egress
  namespace: spanktube
type: Opaque
stringData:
  EGRESS_USERNAME: ""
  EGRESS_PASSWORD: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: spanktube-jwt-signing
  namespace: spanktube
type: Opaque
stringData:
  JWT_PRIVATE_KEY: |
    REPLACE_WITH_PKCS8_RSA_PRIVATE_KEY
  VIEWER_PASSWORD_HASH: ""
  ADMIN_PASSWORD_HASH: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: spanktube-jwt-public
  namespace: spanktube
type: Opaque
stringData:
  JWT_PUBLIC_KEY: |
    REPLACE_WITH_X509_RSA_PUBLIC_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: spanktube-postgres
  namespace: spanktube
type: Opaque
stringData:
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: spanktube-rabbitmq
  namespace: spanktube
type: Opaque
stringData:
  password: ""
