services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  bgutil-pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    restart: unless-stopped

  youtube-upstream-service:
    build:
      context: ../..
      dockerfile: backend/youtube-upstream-service/Dockerfile
      args:
        GRADLE_EXTRA_ARGS: ${GRADLE_EXTRA_ARGS:-}
    image: spanktube/youtube-upstream-service:0.2.0
    restart: unless-stopped
    entrypoint: ["sh", "-c", "cp /run/secrets/youtube-cookies.txt /tmp/youtube-cookies.txt && chmod 600 /tmp/youtube-cookies.txt && exec java -jar /app/app.jar"]
    depends_on:
      redis:
        condition: service_healthy
      bgutil-pot-provider:
        condition: service_started
    environment:
      EGRESS_MODE: direct
      EGRESS_HOST: ""
      EGRESS_PORT: "1080"
      EGRESS_USERNAME: ""
      EGRESS_PASSWORD: ""
      EGRESS_REMOTE_DNS: "false"
      JAVA_TOOL_OPTIONS: -Xmx320m
      REDIS_HOST: redis
      BGUTIL_POT_PROVIDER_URL: http://bgutil-pot-provider:4416
      YT_DLP_EXTRA_ARGS: "--extractor-args,youtubepot-bgutilhttp:base_url=http://bgutil-pot-provider:4416"
      YOUTUBE_COOKIES_FILE: /tmp/youtube-cookies.txt
    volumes:
      - /root/.secrets/youtube-cookies.txt:/run/secrets/youtube-cookies.txt:ro
    ports:
      - "192.168.88.174:8081:8081"
