# Render with: DANTED_IP=... DANTED_PORT=... envsubst < networkpolicy.template.yaml | kubectl apply -f -
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: youtube-egress-only-via-danted
  namespace: spanktube
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [youtube-upstream-service, media-service, archive-service]
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: ${DANTED_IP}/32
      ports:
        - protocol: TCP
          port: ${DANTED_PORT}
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-only-egress
  namespace: spanktube
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [gateway, user-service, redis, postgres, rabbitmq, web]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
