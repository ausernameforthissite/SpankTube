apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: spanktube
data:
  init.sql: |
    create database users;
    create database catalog;
    create database archive;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: spanktube
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: spanktube
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spanktube-postgres
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "spanktube"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: spanktube
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
