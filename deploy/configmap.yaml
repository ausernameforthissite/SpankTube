apiVersion: v1
kind: ConfigMap
metadata:
  name: spanktube-egress
  namespace: spanktube
data:
  # YouTube-facing services (upstream/media) run outside the cluster on the
  # egress box (CT 138, default gateway b4); in-cluster services have no
  # YouTube egress and only keep these keys so envFrom references resolve.
  EGRESS_MODE: "direct"
  EGRESS_HOST: ""
  EGRESS_PORT: "1080"
  EGRESS_REMOTE_DNS: "false"
