# Services exposed on the LAN for the egress box (CT 138): media-service and
# youtube-upstream-service run there in Docker and call back into the cluster.
# NodePort is reachable via any node IP thanks to kube-proxy.
apiVersion: v1
kind: Service
metadata:
  name: user-service-lan
  namespace: spanktube
spec:
  type: NodePort
  selector:
    app: user-service
  ports:
    - port: 8083
      targetPort: 8083
      nodePort: 30083
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service-lan
  namespace: spanktube
spec:
  type: NodePort
  selector:
    app: catalog-service
  ports:
    - port: 8084
      targetPort: 8084
      nodePort: 30084
