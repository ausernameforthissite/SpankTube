apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: spanktube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: catalog-service
          image: registry.local/spanktube/catalog-service:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_DB
              value: catalog
            - name: POSTGRES_USER
              value: spanktube
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spanktube-postgres
                  key: password
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_USERNAME
              value: spanktube
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spanktube-rabbitmq
                  key: password
            - name: USER_SERVICE_URL
              value: http://user-service:8083
            - name: UPSTREAM_SERVICE_URL
              value: http://youtube-upstream-service:8081
            - name: ARCHIVE_ROOT
              value: /archive
          volumeMounts:
            - name: archive
              mountPath: /archive
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              memory: 768Mi
      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: archive
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: spanktube
spec:
  selector:
    app: catalog-service
  ports:
    - port: 8084
      targetPort: 8084
