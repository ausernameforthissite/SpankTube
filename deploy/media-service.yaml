apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: spanktube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-service
  template:
    metadata:
      labels:
        app: media-service
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: media-service
          image: registry.local/spanktube/media-service:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: spanktube-egress
            - secretRef:
                name: spanktube-egress
          env:
            - name: UPSTREAM_SERVICE_URL
              value: http://youtube-upstream-service:8081
            - name: CATALOG_SERVICE_URL
              value: http://catalog-service:8084
            - name: ARCHIVE_ROOT
              value: /archive
          volumeMounts:
            - name: archive
              mountPath: /archive
              readOnly: true
            - name: playback-cache
              mountPath: /tmp/spanktube-playback
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              memory: 1Gi
      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: archive
            readOnly: true
        - name: playback-cache
          emptyDir:
            sizeLimit: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: media-service
  namespace: spanktube
spec:
  selector:
    app: media-service
  ports:
    - port: 8082
      targetPort: 8082
