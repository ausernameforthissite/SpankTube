apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - redis.yaml
  - postgres.yaml
  - rabbitmq.yaml
  - archive-pv.yaml
  - local-files-pv.yaml
  - gateway.yaml
  - user-service.yaml
  - catalog-service.yaml
  - archive-service.yaml
  - web-nginx.yaml
  - web.yaml
  - lan-services.yaml
  - ingress.yaml
# Note: youtube-upstream-service, media-service and the shared redis run on the
# Docker egress box (CT 138, default gateway b4) and are intentionally not part
# of this kustomization; see docs/design (Kubernetes deployment section).
