openapi: 3.1.0
info:
  title: SpankTube Stage 2 API
  version: 0.3.0
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Access and rotating refresh tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
  /api/v1/auth/register:
    post:
      operationId: registerStage2User
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationRequest' }
      responses:
        '200':
          description: Registered user with access and rotating refresh tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Rotated token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
  /api/v1/videos/{videoId}:
    get:
      operationId: getStage2Video
      parameters: [{ $ref: '#/components/parameters/VideoId' }]
      responses:
        '200':
          description: Video with publication date and channel metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Video' }
  /api/v1/search:
    get:
      operationId: searchStage2
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [videos, channels, playlists] }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: YouTube search results with proxied previews
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
  /api/v1/channels/{channelId}:
    get:
      operationId: getStage2Channel
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - name: cursor
          in: query
          schema: { type: string }
        - name: includePlaylists
          in: query
          schema: { type: boolean, default: false }
          description: Load the first playlists page only for the playlists tab; videos and streams do not fetch it
      responses:
        '200':
          description: Channel metadata and avatar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
  /api/v1/channels/{channelId}/videos:
    get:
      operationId: getStage2ChannelVideos
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Channel videos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
  /api/v1/channels/{channelId}/streams:
    get:
      operationId: getStage2ChannelLiveStreams
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Live streams and completed broadcasts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
  /api/v1/channels/{channelId}/playlists:
    get:
      operationId: getStage2ChannelPlaylists
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Channel playlists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
  /api/v1/playlists/{playlistId}:
    get:
      operationId: getStage2Playlist
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Playlist with previews
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
  /api/v1/metadata/logs:
    get:
      operationId: streamStage2MetadataLogs
      parameters:
        - name: session
          in: query
          required: true
          schema: { type: string, minLength: 8, maxLength: 80 }
      responses:
        '200':
          description: Last ten metadata preparation log lines and heartbeat
          content:
            text/event-stream:
              schema: { type: string }
  /api/v1/library/user-playlists:
    get:
      operationId: getStage2UserPlaylists
      responses:
        '200':
          description: Current user's internal playlists
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserPlaylist' }
    post:
      operationId: createStage2UserPlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserPlaylistRequest' }
      responses:
        '201':
          description: Created playlist; optional initial video is included without starting an archive job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPlaylist' }
  /api/v1/library/user-playlists/{playlistId}:
    get:
      operationId: getStage2UserPlaylist
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      responses:
        '200':
          description: Shared internal playlist readable by any authenticated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPlaylist' }
  /api/v1/library/user-playlists/{playlistId}/videos:
    post:
      operationId: addStage2UserPlaylistVideo
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddVideoRequest' }
      responses:
        '204':
          description: Video added by playlist owner; no archive job is created
  /api/v1/library/progress:
    get:
      operationId: getStage2WatchProgress
      responses:
        '200':
          description: Current user's playback positions for resume and progress bars
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProgressEntry' }
  /api/v1/library/playlists/{playlistId}/videos:
    get:
      operationId: getStage2LibraryPlaylistVideos
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
        - name: scope
          in: query
          schema: { type: string, enum: [own, all, global], default: own }
      responses:
        '200':
          description: Archived videos in playlist; all scope is admin-only, global is read-only
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LibraryItem' }
  /api/v1/library/locations:
    get:
      operationId: getStage2LibraryLocations
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [own, all, global], default: own }
      responses:
        '200':
          description: Archive locations for badge navigation; all scope is admin-only, global is read-only
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LibraryLocation' }
  /api/v1/library:
    get:
      operationId: getStage2Library
      parameters:
        - name: channelId
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [size, duration, title], default: size }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: scope
          in: query
          schema: { type: string, enum: [own, all, global], default: own }
      responses:
        '200':
          description: Current user's library grouped by channel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryResponse' }
  /api/v1/library/{videoId}:
    delete:
      operationId: deleteStage2LibraryItem
      parameters: [{ $ref: '#/components/parameters/VideoId' }]
      responses:
        '204':
          description: User link removed; physical file removed only with the last link
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/library/{videoId}/file:
    get:
      operationId: downloadStage2LibraryFile
      parameters: [{ $ref: '#/components/parameters/VideoId' }]
      responses:
        '200':
          description: MKV download on the user's device
          content:
            video/x-matroska:
              schema: { type: string, format: binary }
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/videos/{videoId}/archive:
    get:
      operationId: getStage2ArchiveAvailability
      parameters: [{ $ref: '#/components/parameters/VideoId' }]
      responses:
        '200':
          description: Whether any user's archived copy is available for direct download
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveAvailability' }
  /api/v1/videos/{videoId}/archive/versions:
    get:
      operationId: getStage2ArchiveVersions
      parameters: [{ $ref: '#/components/parameters/VideoId' }]
      responses:
        '200':
          description: All retained versions, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ArchiveVersion' }
  /api/v1/videos/{videoId}/archive/versions/{versionId}/file:
    get:
      operationId: downloadStage2ArchiveVersion
      parameters:
        - $ref: '#/components/parameters/VideoId'
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Selected archived version
          content:
            video/x-matroska:
              schema: { type: string, format: binary }
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/videos/{videoId}/progress:
    post:
      operationId: reportStage2WatchProgress
      parameters: [{ $ref: '#/components/parameters/VideoId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WatchProgressRequest' }
      responses:
        '202':
          description: Progress accepted; archiving starts at 30 seconds or 5 percent
  /api/v1/videos/{videoId}/recording:
    get:
      operationId: getStage2LiveRecording
      parameters: [{ $ref: '#/components/parameters/VideoId' }]
      responses:
        '200':
          description: Current or most recent recording owned by this user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRecording' }
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/videos/{videoId}/recording/start:
    post:
      operationId: startStage2LiveRecording
      parameters: [{ $ref: '#/components/parameters/VideoId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveRecordingRequest' }
      responses:
        '200':
          description: Active recording reused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRecording' }
        '202':
          description: Recording started in the background
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRecording' }
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/videos/{videoId}/recording/stop:
    post:
      operationId: stopStage2LiveRecording
      parameters: [{ $ref: '#/components/parameters/VideoId' }]
      responses:
        '200':
          description: Recording finalized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRecording' }
        '202':
          description: Recording is being finalized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRecording' }
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/videos/{videoId}/download:
    post:
      operationId: downloadStage2Video
      parameters: [{ $ref: '#/components/parameters/VideoId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DownloadOptions' }
      responses:
        '200':
          description: Ready file or reusable variant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveJob' }
        '202':
          description: New background download job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveJob' }
  /api/v1/videos/{videoId}/refresh:
    post:
      operationId: refreshStage2Video
      parameters: [{ $ref: '#/components/parameters/VideoId' }]
      responses:
        '200':
          description: Active refresh job reused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveJob' }
        '202':
          description: Download current YouTube copy as a new archive version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveJob' }
  /api/v1/videos/{videoId}/save:
    post:
      operationId: saveStage2Video
      parameters: [{ $ref: '#/components/parameters/VideoId' }]
      responses:
        '200':
          description: Active or already completed archive job reused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveJob' }
        '202':
          description: Persistent archive job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveJob' }
  /api/v1/archive/estimate:
    post:
      operationId: estimateStage2Archive
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveEstimateRequest' }
      responses:
        '200':
          description: Estimated bytes and download time before the user confirms a batch archive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveEstimate' }
        '204':
          description: Estimation was cancelled before a result became available
  /api/v1/archive/estimate/{estimateId}:
    get:
      operationId: getStage2ArchiveEstimateProgress
      parameters:
        - { name: estimateId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Current collection and per-video estimation progress for the owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveEstimateProgress' }
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: cancelStage2ArchiveEstimate
      parameters:
        - { name: estimateId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Active estimation cancelled; queued videos will not be requested
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/archive/estimate/{estimateId}/events:
    get:
      operationId: streamStage2ArchiveEstimateProgress
      parameters:
        - { name: estimateId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Owner-only SSE stream. Page and video events carry ArchiveEstimateProgress JSON; ping is a heartbeat. Disconnect before a terminal event cancels the estimate.
          content:
            text/event-stream:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/archive/channel-status/{channelId}:
    get:
      operationId: getStage2ChannelArchiveStatus
      parameters:
        - { name: channelId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Last channel archive time and new videos/playlists since it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelArchiveStatus' }
  /api/v1/playlists/{playlistId}/save:
    post:
      operationId: saveStage2Playlist
      parameters:
        - { $ref: '#/components/parameters/PlaylistId' }
        - { name: estimateId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: First job; each playlist video has an independent queue entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveJob' }
  /api/v1/channels/{channelId}/save:
    post:
      operationId: saveStage2Channel
      parameters:
        - { $ref: '#/components/parameters/ChannelId' }
        - { name: estimateId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: First job; each channel video has an independent queue entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveJob' }
  /api/v1/archive/jobs:
    delete:
      operationId: clearStage2ArchiveJobs
      responses:
        '204': { description: All visible terminal jobs dismissed; temporary files removed }
    get:
      operationId: getStage2ArchiveJobs
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [queued, running, completed, failed] }
      responses:
        '200':
          description: Visible jobs; failures expire after one hour and per-user dismissals are excluded
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ArchiveJob' }
  /api/v1/archive/events:
    get:
      operationId: streamStage2Queue
      responses:
        '200':
          description: Server-sent queue updates and heartbeat; only own jobs and aggregate waiting count
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/QueueSnapshot' }
  /media/v/{videoId}/logs:
    get:
      operationId: streamStage2PlaybackLogs
      parameters:
        - $ref: '#/components/parameters/VideoId'
        - name: session
          in: query
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9-]{8,80}$' }
      responses:
        '200':
          description: Playback preparation log; playback-log events contain at most ten recent lines
          content:
            text/event-stream:
              schema: { type: string }
  /api/v1/archive/jobs/{jobId}/file:
    get:
      operationId: downloadStage2JobFile
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Completed MKV or MP3 with a meaningful filename
          content:
            video/x-matroska:
              schema: { type: string, format: binary }
            audio/mpeg:
              schema: { type: string, format: binary }
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/archive/jobs/{jobId}:
    get:
      operationId: getStage2ArchiveJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Archive job visible to its owner or an administrator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveJob' }
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: dismissStage2ArchiveJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Terminal job hidden only for the current user
        '409':
          description: Active jobs cannot be dismissed
  /api/v1/admin/library:
    get:
      operationId: getStage2AdminLibrary
      parameters:
        - name: username
          in: query
          schema: { type: string }
        - name: channelId
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [size, duration, title] }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: All libraries, or one user's library with quotas
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LibraryResponse'
                  - type: object
                    properties:
                      channels:
                        type: array
                        items: { $ref: '#/components/schemas/LibraryChannel' }
  /api/v1/admin/library/{videoId}:
    delete:
      operationId: deleteStage2AdminLibraryItem
      parameters:
        - $ref: '#/components/parameters/VideoId'
        - name: username
          in: query
          required: true
          schema: { type: string }
      responses:
        '204':
          description: User link removed; physical file removed only with the last link
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/users/me/settings:
    get:
      operationId: getStage2Settings
      responses:
        '200':
          description: Current user's settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettings' }
    patch:
      operationId: updateStage2Settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsPatch' }
      responses:
        '200':
          description: Updated settings; fields not present in the request are unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettings' }
  /api/v1/users/me/avatar:
    get:
      operationId: getStage2Avatar
      responses:
        '200':
          description: User avatar image
          content:
            image/*:
              schema: { type: string, format: binary }
        '404':
          $ref: '#/components/responses/Error'
    put:
      operationId: uploadStage2Avatar
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        '204': { description: Avatar replaced; PNG, JPEG or WEBP up to 256x256 and 200 KiB }
    delete:
      operationId: deleteStage2Avatar
      responses:
        '204': { description: Avatar removed; generated animal avatar is used }
  /api/v1/invites:
    get:
      operationId: getStage2Invites
      responses:
        '200':
          description: Invites created by current administrator
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invite' }
    post:
      operationId: createStage2Invite
      responses:
        '200':
          description: New invite valid for seven days
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }
  /api/v1/admin/users:
    get:
      operationId: getStage2Users
      responses:
        '200':
          description: Users and effective quotas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserQuota' }
  /api/v1/admin/users/{username}/quota:
    get:
      operationId: getStage2UserQuota
      parameters: [{ $ref: '#/components/parameters/Username' }]
      responses:
        '200':
          description: Effective user quota
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserQuota' }
    put:
      operationId: setStage2UserQuota
      parameters: [{ $ref: '#/components/parameters/Username' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuotaUpdate' }
      responses:
        '200':
          description: Updated personal quota
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveQuota' }
    delete:
      operationId: resetStage2UserQuota
      parameters: [{ $ref: '#/components/parameters/Username' }]
      responses:
        '200':
          description: Personal override removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveQuota' }
  /api/v1/admin/storage:
    get:
      operationId: getStage2Storage
      responses:
        '200':
          description: NFS and per-user quota usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageResponse' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    VideoId:
      name: videoId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{11}$' }
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { type: string }
    PlaylistId:
      name: playlistId
      in: path
      required: true
      schema: { type: string }
    Username:
      name: username
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    RegistrationRequest:
      type: object
      required: [invite, username, password]
      properties:
        invite: { type: string }
        username: { type: string, minLength: 3, maxLength: 32, pattern: '^[A-Za-z0-9_.-]+$' }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    TokenPair:
      type: object
      required: [accessToken, tokenType, expiresIn, refreshToken, refreshExpiresIn, role]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, format: int64 }
        refreshToken: { type: string }
        refreshExpiresIn: { type: integer, format: int64 }
        role: { type: string, enum: [VIEWER, ADMIN] }
    WatchProgressRequest:
      type: object
      required: [positionSeconds, durationSeconds]
      properties:
        positionSeconds: { type: integer, format: int64, minimum: 0 }
        durationSeconds: { type: integer, format: int64, minimum: 1 }
    Channel:
      type: object
      required: [channelId, title, url, avatarUrl]
      properties:
        channelId: { type: string }
        title: { type: string }
        handle: { type: [string, 'null'] }
        customPath: { type: [string, 'null'] }
        url: { type: string, description: SpankTube route mirroring YouTube }
        avatarUrl: { type: string, description: media-service URL }
        subscriberCount: { type: [integer, 'null'], format: int64 }
        videos:
          type: array
          items: { $ref: '#/components/schemas/SearchItem' }
        playlists:
          type: array
          items: { $ref: '#/components/schemas/SearchItem' }
        nextCursor: { type: [string, 'null'] }
        videoCount: { type: [integer, 'null'], format: int64 }
        totalPages: { type: [integer, 'null'], format: int32 }
    Video:
      type: object
      required: [videoId, title, publishedAt, channelId, channelName, channelAvatarUrl, channelUrl, thumbnailUrl, manifestUrl, formats, subtitles, sponsorBlock]
      properties:
        videoId: { type: string }
        title: { type: string }
        description: { type: [string, 'null'] }
        publishedAt: { type: string }
        durationSeconds: { type: [integer, 'null'], format: int64 }
        viewCount: { type: [integer, 'null'], format: int64 }
        likeCount: { type: [integer, 'null'], format: int64 }
        channelId: { type: string }
        channelName: { type: string }
        channelAvatarUrl: { type: [string, 'null'], description: media-service URL }
        channelUrl: { type: string, description: SpankTube channel route }
        thumbnailUrl: { type: [string, 'null'], description: media-service URL }
        madeForKids: { type: boolean, description: YouTube Kids marker confirmed by the dedicated upstream client }
        streamType: { type: string, enum: [VIDEO_STREAM, AUDIO_STREAM, LIVE_STREAM, AUDIO_LIVE_STREAM, POST_LIVE_STREAM, POST_LIVE_AUDIO_STREAM], default: VIDEO_STREAM }
        manifestUrl: { type: string, description: DASH manifest for videos and broadcast recordings; live.m3u8 for an active live stream without DASH }
        formats:
          type: array
          items: { $ref: '#/components/schemas/Format' }
        subtitles:
          type: array
          items: { $ref: '#/components/schemas/Subtitle' }
        sponsorBlock:
          type: array
          items: { $ref: '#/components/schemas/SponsorSegment' }
        dislikeCountEstimate: { type: [integer, 'null'], format: int64 }
    Format:
      type: object
      required: [formatId, segmentUrl, hasVideo, hasAudio]
      properties:
        formatId: { type: string }
        mimeType: { type: [string, 'null'] }
        codecs: { type: [string, 'null'] }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        fps: { type: [number, 'null'] }
        bitrate: { type: [integer, 'null'], format: int64 }
        hasVideo: { type: boolean }
        hasAudio: { type: boolean }
        trackId: { type: string, description: unique media-service track identifier, including audio language variants }
        language: { type: [string, 'null'] }
        label: { type: [string, 'null'] }
        original: { type: [boolean, 'null'] }
        autoGenerated: { type: boolean, default: false }
        segmentUrl: { type: string }
    Subtitle:
      type: object
      required: [trackId, language, label, url]
      properties:
        trackId: { type: string }
        language: { type: string }
        label: { type: string }
        autoGenerated: { type: boolean, default: false }
        url: { type: string, description: media-service URL }
    SponsorSegment:
      type: object
      required: [startSeconds, endSeconds, category]
      properties:
        startSeconds: { type: number }
        endSeconds: { type: number }
        category: { type: string }
    SearchItem:
      type: object
      required: [kind, id, title, url, thumbnailUrl]
      properties:
        kind: { type: string, enum: [video, channel, playlist] }
        id: { type: string }
        title: { type: string }
        url: { type: string, description: SpankTube route mirroring YouTube }
        thumbnailUrl: { type: string, description: media-service URL }
        channelName: { type: [string, 'null'] }
        durationSeconds: { type: [integer, 'null'], format: int64 }
        videoCount: { type: [integer, 'null'] }
        viewCount: { type: [integer, 'null'], format: int64 }
        publishedAt: { type: [string, 'null'], description: Publication date or ISO timestamp when available }
        streamType: { type: string, enum: [VIDEO_STREAM, AUDIO_STREAM, LIVE_STREAM, AUDIO_LIVE_STREAM, POST_LIVE_STREAM, POST_LIVE_AUDIO_STREAM], default: VIDEO_STREAM }
    SearchResults:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchItem' }
        nextCursor: { type: [string, 'null'] }
    Playlist:
      type: object
      required: [playlistId, title, items]
      properties:
        playlistId: { type: string }
        title: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchItem' }
        nextCursor: { type: [string, 'null'] }
        videoCount: { type: [integer, 'null'], format: int64 }
        totalPages: { type: [integer, 'null'], format: int32 }
    LibraryItem:
      type: object
      required: [videoId, title, durationSeconds, sizeBytes, sizeMB, downloadUrl, lastAccessedAt]
      properties:
        videoId: { type: string }
        title: { type: string }
        durationSeconds: { type: integer, format: int64 }
        sizeBytes: { type: integer, format: int64 }
        sizeMB: { type: number }
        downloadUrl: { type: string }
        lastAccessedAt: { type: string, format: date-time }
        thumbnailUrl: { type: string, description: media-service URL }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        videoCodec: { type: [string, 'null'] }
        audioCodec: { type: [string, 'null'] }
        audioBitrate: { type: [integer, 'null'], format: int64, description: Audio bitrate in bits per second, measured by ffprobe or read from info.json }
        filename: { type: string, description: '<YouTube title> [<videoId>] (<resolution>, <video codec>, <audio codec>).mkv' }
    LibraryChannel:
      type: object
      required: [channel, videos, playlists, totalBytes]
      properties:
        channel: { $ref: '#/components/schemas/Channel' }
        videos:
          type: array
          items: { $ref: '#/components/schemas/LibraryItem' }
        playlists:
          type: array
          items: { $ref: '#/components/schemas/LibraryPlaylist' }
        totalBytes: { type: integer, format: int64 }
    LibraryPlaylist:
      type: object
      required: [playlistId, title, videoCount, thumbnailUrl, videoIds]
      properties:
        playlistId: { type: string }
        title: { type: string }
        videoCount: { type: integer, format: int64 }
        thumbnailUrl: { type: string, description: archived playlist thumbnail URL; 404 triggers the 2x2 video collage }
        videoIds:
          type: array
          items: { type: string }
    UserPlaylist:
      type: object
      required: [playlistId, title, ownerUsername, videoCount, videoIds]
      properties:
        playlistId: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        ownerUsername: { type: string }
        videoCount: { type: integer, format: int64 }
        videoIds:
          type: array
          items: { type: string }
    CreateUserPlaylistRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        videoId: { type: [string, 'null'], description: Optional video to add immediately; does not start archiving }
    AddVideoRequest:
      type: object
      required: [videoId]
      properties:
        videoId: { type: string }
    LibraryLocation:
      type: object
      required: [videoId, channelId, playlistId]
      properties:
        videoId: { type: string }
        channelId: { type: string }
        playlistId: { type: [string, 'null'] }
    LibraryResponse:
      type: object
      required: [channels, usedBytes, quotaBytes, lruThresholdPercent]
      properties:
        channels:
          type: array
          items: { $ref: '#/components/schemas/LibraryChannel' }
        usedBytes: { type: integer, format: int64 }
        quotaBytes: { type: integer, format: int64 }
        lruThresholdPercent: { type: integer, enum: [90] }
    QueueSnapshot:
      type: object
      required: [jobs, beforeYou]
      properties:
        jobs:
          type: array
          items: { $ref: '#/components/schemas/ArchiveJob' }
        beforeYou: { type: integer, format: int64, description: Count only; no other users' metadata }
    DownloadOptions:
      type: object
      required: [subtitles, sponsorBlock]
      properties:
        videoFormatId: { type: [string, 'null'], description: Null selects best video or audio-only with a selected audio track }
        audioFormatId: { type: [string, 'null'], description: Null selects best audio or video-only with a selected video track }
        subtitles: { type: boolean, default: true, description: Human-created subtitles only }
        sponsorBlock: { type: boolean, default: true }
    LiveRecordingRequest:
      type: object
      description: Exact Shaka variant selected when recording starts; omitted values select the best available quality
      properties:
        height: { type: [integer, 'null'], minimum: 1 }
        bandwidth: { type: [integer, 'null'], format: int64, minimum: 1 }
    LiveRecording:
      type: object
      required: [id, videoId, ownerUsername, status, title, startedAt, bytesDownloaded]
      properties:
        id: { type: string, format: uuid }
        videoId: { type: string }
        ownerUsername: { type: string }
        status: { type: string, enum: [RECORDING, STOPPING, COMPLETED, FAILED] }
        title: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        bytesDownloaded: { type: integer, format: int64 }
        durationSeconds: { type: [integer, 'null'], format: int64 }
        fileName: { type: [string, 'null'], description: MKV filename containing the UTC recording start time }
        downloadUrl: { type: [string, 'null'], description: Available after the recording is finalized and registered in the library }
        error: { type: [string, 'null'] }
    ArchiveAvailability:
      type: object
      required: [archived, version]
      properties:
        archived: { type: boolean }
        downloadUrl: { type: [string, 'null'] }
        filename: { type: [string, 'null'] }
        version:
          oneOf:
            - $ref: '#/components/schemas/ArchiveVersion'
            - type: 'null'
    ArchiveVersion:
      type: object
      required: [versionId, videoId, title, durationSeconds, sizeBytes, channelId, channelName, channelUrl, channelAvatarUrl, downloadUrl, filename, current]
      properties:
        versionId: { type: string, format: uuid }
        videoId: { type: string }
        title: { type: string }
        description: { type: [string, 'null'] }
        publishedAt: { type: [string, 'null'] }
        durationSeconds: { type: [integer, 'null'], format: int64 }
        sizeBytes: { type: integer, format: int64 }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        videoCodec: { type: [string, 'null'] }
        audioCodec: { type: [string, 'null'] }
        audioBitrate: { type: [integer, 'null'], format: int64, description: Audio bitrate in bits per second, measured by ffprobe or read from info.json }
        channelId: { type: string }
        channelName: { type: string }
        channelUrl: { type: string }
        channelAvatarUrl: { type: string, description: media-service URL }
        downloadUrl: { type: string }
        filename: { type: string }
        current: { type: boolean }
    ProgressEntry:
      type: object
      required: [videoId, positionSeconds, watchPercent, lastAccessedAt]
      properties:
        videoId: { type: string }
        positionSeconds: { type: integer, format: int64, minimum: 0 }
        watchPercent: { type: number, minimum: 0, maximum: 100 }
        lastAccessedAt: { type: string, format: date-time }
    Invite:
      type: object
      required: [code, expiresAt]
      properties:
        code: { type: string }
        expiresAt: { type: string, format: date-time }
        usedBy: { type: [string, 'null'] }
    UserSettings:
      type: object
      required: [autoArchive, autoplay, hideTechnicalDetails, preferBestQuality, theme]
      properties:
        autoArchive: { type: boolean, default: true }
        autoplay: { type: boolean, default: true }
        hideTechnicalDetails: { type: boolean, default: false }
        preferBestQuality: { type: boolean, default: true }
        theme: { type: string, enum: [system, light, dark], default: system }
    SettingsPatch:
      type: object
      minProperties: 1
      properties:
        autoArchive: { type: boolean }
        autoplay: { type: boolean }
        hideTechnicalDetails: { type: boolean }
        preferBestQuality: { type: boolean }
        theme: { type: string, enum: [system, light, dark] }
    ArchiveEstimateRequest:
      type: object
      required: [kind, targetId]
      properties:
        kind: { type: string, enum: [PLAYLIST, CHANNEL] }
        targetId: { type: string }
        estimateId: { type: string, format: uuid, description: Optional client-generated id used for SSE estimation progress and cancellation }
    ArchiveEstimate:
      type: object
      required: [estimateId, kind, targetId, owner, totalVideoCount, newVideoCount, existingVideoCount, videoBytes, audioBytes, totalBytes, estimatedSeconds, videoBps, audioBps, videoIds, createdAt]
      properties:
        estimateId: { type: string, format: uuid }
        kind: { type: string, enum: [PLAYLIST, CHANNEL] }
        targetId: { type: string }
        owner: { type: string }
        totalVideoCount: { type: integer }
        newVideoCount: { type: integer }
        existingVideoCount: { type: integer }
        videoBytes: { type: integer, format: int64 }
        audioBytes: { type: integer, format: int64 }
        totalBytes: { type: integer, format: int64 }
        estimatedSeconds: { type: integer, format: int64 }
        videoBps: { type: integer, format: int64 }
        audioBps: { type: integer, format: int64 }
        videoIds:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    ArchiveEstimateProgress:
      type: object
      required: [estimateId, kind, targetId, owner, status, totalVideoCount, processedVideoCount, newVideoCount, existingVideoCount, videoBytes, audioBytes, totalBytes, estimatedSeconds, videoBps, audioBps, discoveredVideoCount, pageNumber, pageVideoCount, remainingOnPage, videosPerSecond, createdAt, updatedAt]
      properties:
        estimateId: { type: string, format: uuid }
        kind: { type: string, enum: [PLAYLIST, CHANNEL] }
        targetId: { type: string }
        owner: { type: string }
        status: { type: string, enum: [COLLECTING, ESTIMATING, COMPLETED, FAILED, CANCELLED] }
        totalVideoCount: { type: integer }
        processedVideoCount: { type: integer }
        newVideoCount: { type: integer }
        existingVideoCount: { type: integer }
        videoBytes: { type: integer, format: int64 }
        audioBytes: { type: integer, format: int64 }
        totalBytes: { type: integer, format: int64 }
        estimatedSeconds: { type: integer, format: int64 }
        videoBps: { type: integer, format: int64 }
        audioBps: { type: integer, format: int64 }
        discoveredVideoCount: { type: integer, description: Videos found on opened pages during collection; may include cross-playlist duplicates until the final merge }
        pageNumber: { type: integer, description: Last opened or analysed page within this estimation }
        pageVideoCount: { type: integer, description: Videos assigned to the current page for analysis }
        remainingOnPage: { type: integer, description: Videos not yet analysed on the current page }
        videosPerSecond: { type: number, format: double, description: Completed video analyses divided by elapsed analysis time, excluding page collection }
        error: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChannelArchiveStatus:
      type: object
      required: [lastArchivedAt, newVideoCount, newPlaylistCount]
      properties:
        lastArchivedAt: { type: [string, 'null'], format: date-time }
        newVideoCount: { type: integer, description: Unarchived videos published after lastArchivedAt }
        newPlaylistCount: { type: integer, description: Channel playlists not present in the user's archive; YouTube does not expose their creation date }
    ArchiveJob:
      type: object
      required: [id, kind, targetId, ownerUsername, ownerRole, priority, status, totalCount, completedCount, failedCount, createdAt, updatedAt, purpose, stage, bytesDownloaded, totalBytes, speedBps, title, options]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [VIDEO, PLAYLIST, CHANNEL, DOWNLOAD, REFRESH] }
        targetId: { type: string }
        ownerUsername: { type: string }
        ownerRole: { type: string, enum: [VIEWER, ADMIN] }
        priority: { type: integer }
        status: { type: string, enum: [queued, running, completed, failed] }
        totalCount: { type: integer, description: Processing stages for a single video; legacy batches count videos }
        completedCount: { type: integer }
        failedCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        nextAttemptAt: { type: [string, 'null'], format: date-time }
        error: { type: [string, 'null'] }
        purpose: { type: string, enum: [ARCHIVE, DOWNLOAD] }
        stage: { type: string, enum: [QUEUED, WAITING, METADATA, DOWNLOADING, DOWNLOADING_VIDEO, DOWNLOADING_AUDIO, SUBTITLES, SPONSORBLOCK, MUXING, CHAPTERS, FINISHING, COMPLETED, FAILED, EXPIRED] }
        bytesDownloaded: { type: integer, format: int64, minimum: 0 }
        totalBytes: { type: integer, format: int64, minimum: 0 }
        speedBps: { type: integer, format: int64, minimum: 0 }
        downloadUrl: { type: [string, 'null'] }
        title: { type: string }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        videoCodec: { type: [string, 'null'] }
        audioCodec: { type: [string, 'null'] }
        audioBitrate: { type: [integer, 'null'], format: int64, description: Audio bitrate in bits per second, measured by ffprobe or read from info.json }
        currentVideoId: { type: [string, 'null'], description: Item currently being downloaded or processed }
        fileName: { type: [string, 'null'] }
        options: { $ref: '#/components/schemas/DownloadOptions' }
    EffectiveQuota:
      type: object
      required: [username, role, quotaBytes, effectiveQuotaBytes, lruThresholdPercent]
      properties:
        username: { type: string }
        role: { type: string, enum: [VIEWER, ADMIN] }
        quotaBytes: { type: [integer, 'null'], format: int64 }
        effectiveQuotaBytes: { type: integer, format: int64 }
        lruThresholdPercent: { type: integer, enum: [90] }
    UserQuota:
      type: object
      required: [username, role, quotaBytes, usedBytes, effectiveQuotaBytes, lruThresholdPercent]
      properties:
        username: { type: string }
        role: { type: string, enum: [VIEWER, ADMIN] }
        quotaBytes: { type: [integer, 'null'], format: int64, description: Personal override or null }
        usedBytes: { type: integer, format: int64 }
        effectiveQuotaBytes: { type: integer, format: int64 }
        lruThresholdPercent: { type: integer, enum: [90] }
    QuotaUpdate:
      type: object
      properties:
        quotaBytes: { type: [integer, 'null'], format: int64, minimum: 1, description: Null removes the personal override }
    StorageUser:
      type: object
      required: [username, role, usedBytes, effectiveQuotaBytes, lruThresholdPercent]
      properties:
        username: { type: string }
        role: { type: string, enum: [VIEWER, ADMIN] }
        usedBytes: { type: integer, format: int64 }
        effectiveQuotaBytes: { type: integer, format: int64 }
        lruThresholdPercent: { type: integer, enum: [90] }
    StorageResponse:
      type: object
      required: [nfsTotalBytes, nfsFreeBytes, users]
      properties:
        nfsTotalBytes: { type: integer, format: int64 }
        nfsFreeBytes: { type: integer, format: int64 }
        users:
          type: array
          items: { $ref: '#/components/schemas/StorageUser' }
    ApiError:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        actions:
          type: array
          items: { type: string }
security:
  - bearerAuth: []
