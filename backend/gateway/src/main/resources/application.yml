server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      httpclient:
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:900s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

spanktube:
  gateway:
    user-service-url: ${USER_SERVICE_URL:http://localhost:8083}
    upstream-service-url: ${UPSTREAM_SERVICE_URL:http://localhost:8081}
    media-service-url: ${MEDIA_SERVICE_URL:http://localhost:8082}
    catalog-service-url: ${CATALOG_SERVICE_URL:http://localhost:8084}
    archive-service-url: ${ARCHIVE_SERVICE_URL:http://localhost:8085}
    jwt-public-key: ${JWT_PUBLIC_KEY:}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
