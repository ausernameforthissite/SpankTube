server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:catalog}
    username: ${POSTGRES_USER:spanktube}
    password: ${POSTGRES_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  mvc:
    async:
      request-timeout: ${CATALOG_ASYNC_TIMEOUT_MS:120000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

spanktube:
  events:
    enabled: ${EVENTS_ENABLED:true}
    exchange: spanktube.events
  archive:
    root: ${ARCHIVE_ROOT:/archive}
  user:
    url: ${USER_SERVICE_URL:http://localhost:8083}
  upstream:
    url: ${UPSTREAM_SERVICE_URL:http://localhost:8081}
