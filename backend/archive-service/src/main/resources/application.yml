server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: archive-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:archive}
    username: ${POSTGRES_USER:spanktube}
    password: ${POSTGRES_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  mvc:
    async:
      request-timeout: ${ARCHIVE_ASYNC_TIMEOUT_MS:900000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

spanktube:
  events:
    enabled: ${EVENTS_ENABLED:true}
    exchange: spanktube.events
  archive:
    root: ${ARCHIVE_ROOT:/archive}
    min-delay-seconds: ${ARCHIVE_MIN_DELAY_SECONDS:2}
    max-delay-seconds: ${ARCHIVE_MAX_DELAY_SECONDS:5}
    download-timeout: ${ARCHIVE_DOWNLOAD_TIMEOUT:1h}
    worker-delay-ms: ${ARCHIVE_WORKER_DELAY_MS:2000}
    yt-dlp-executable: ${YT_DLP_EXECUTABLE:yt-dlp}
    ffmpeg-executable: ${FFMPEG_EXECUTABLE:ffmpeg}
    ffprobe-executable: ${FFPROBE_EXECUTABLE:ffprobe}
    cleanup-cron: ${ARCHIVE_CLEANUP_CRON:0 */15 * * * *}
  upstream:
    url: ${UPSTREAM_SERVICE_URL:http://localhost:8081}
  media:
    url: ${MEDIA_SERVICE_URL:http://localhost:8082}
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8084}
  user:
    url: ${USER_SERVICE_URL:http://localhost:8083}
  egress:
    mode: ${EGRESS_MODE:socks5}
    host: ${EGRESS_HOST:}
    port: ${EGRESS_PORT:1080}
    username: ${EGRESS_USERNAME:}
    password: ${EGRESS_PASSWORD:}
    remote-dns: ${EGRESS_REMOTE_DNS:true}
    probe:
      enabled: true
      interval: 30s
      timeout: 10s
