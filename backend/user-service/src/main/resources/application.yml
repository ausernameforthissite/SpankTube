server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:users}
    username: ${POSTGRES_USER:spanktube}
    password: ${POSTGRES_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

spanktube:
  auth:
    issuer: ${JWT_ISSUER:spanktube}
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    users:
      viewer:
        password-hash: ${VIEWER_PASSWORD_HASH:}
        role: VIEWER
      admin:
        password-hash: ${ADMIN_PASSWORD_HASH:}
        role: ADMIN
  quota:
    admin-default-bytes: ${ADMIN_QUOTA_BYTES:53687091200}
    viewer-default-bytes: ${VIEWER_QUOTA_BYTES:10737418240}
    lru-threshold-percent: ${LRU_THRESHOLD_PERCENT:90}
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8084}
